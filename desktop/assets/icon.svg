<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#161426"/>
      <stop offset="55%" stop-color="#090915"/>
      <stop offset="100%" stop-color="#020206"/>
    </radialGradient>

    <linearGradient id="whiteMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#f4efff"/>
      <stop offset="72%" stop-color="#d9d0ec"/>
      <stop offset="100%" stop-color="#c3b9d9"/>
    </linearGradient>

    <linearGradient id="purpleMetal" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f2dfff"/>
      <stop offset="24%" stop-color="#c480ff"/>
      <stop offset="58%" stop-color="#8b45ef"/>
      <stop offset="100%" stop-color="#5c26c9"/>
    </linearGradient>

    <filter id="purpleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded rectangle backplate to match macOS Big Sur+ icon style -->
  <rect x="96" y="96" width="832" height="832" rx="184" ry="184" fill="url(#bg)"/>

  <!-- XanaOS "X" glyph, scaled/centered from the shared source artwork's
       285..965 x 218..898 crop (same crop favicon.svg uses) into the
       832x832 backplate interior. -->
  <g transform="translate(-252.71 -170.73) scale(1.223529)">
    <g filter="url(#purpleGlow)">
      <path d="M 300 288
               L 414 288
               C 438 288, 452 298, 469 314
               L 710 560
               L 461 810
               C 445 826, 432 829, 412 829
               L 303 829
               L 549 583
               C 566 566, 566 549, 549 532
               Z"
            fill="url(#whiteMetal)"
            stroke="#efe8ff" stroke-width="2.2"/>
    </g>
    <g filter="url(#purpleGlow)">
      <path d="M 649 452
               L 794 307
               C 810 292, 826 288, 847 288
               L 949 288
               L 719 521
               Z"
            fill="url(#purpleMetal)"
            stroke="#d2adff" stroke-width="2"/>
    </g>
    <g filter="url(#purpleGlow)">
      <path d="M 652 663
               L 721 594
               L 951 829
               L 852 829
               C 828 829, 813 823, 799 809
               Z"
            fill="url(#purpleMetal)"
            stroke="#b47aff" stroke-width="2"/>
    </g>
    <path d="M 319 291 L 414 291 C 437 291 450 301 467 317"
          fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
    <path d="M 795 309 C 811 294 826 291 846 291 L 930 291"
          fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.8"/>
  </g>
</svg>
